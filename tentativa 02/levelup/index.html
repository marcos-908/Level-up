<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEVEL UP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="toasts" aria-live="polite"></div>
<div id="cfg" class="card hidden" style="max-width:600px;margin:2rem auto"><h2>Falta configurar</h2><p>Abra <code>js/config.js</code> e cole sua chave pública (anon/publishable) do Supabase. Veja o README.</p></div>
<section id="auth"><div class="logo lvl">LEVEL UP</div><form id="af" class="card"><h2 id="a-title">Entrar</h2><label>E-mail</label><input id="a-email" type="email" autocomplete="email" required>
<div id="f-pass"><label>Senha</label><input id="a-pass" type="password" autocomplete="current-password"></div><div id="f-pass2" class="hidden"><label>Confirmar senha</label><input id="a-pass2" type="password" autocomplete="new-password"></div>
<label><input type="checkbox" id="show" style="width:auto"> Mostrar senha</label><div class="row" style="margin-top:.8rem"><button id="a-go" class="btn">Entrar</button></div>
<div class="row" style="margin-top:.8rem"><button type="button" class="btn ghost sm" data-m="login">Entrar</button><button type="button" class="btn ghost sm" data-m="signup">Criar conta</button><button type="button" class="btn ghost sm" data-m="reset">Esqueci a senha</button></div></form></section>
<div id="shell" class="hidden"><nav><div class="logo">LEVEL UP</div><a href="#inicio" data-r="inicio">Início</a><a href="#tarefas" data-r="tarefas">Tarefas</a><a href="#config" data-r="config">Configurações</a></nav>
<main><header class="top"><span class="mut">Jogador: <b id="who"></b></span><button id="logout" class="btn ghost sm">Sair</button></header><div id="view"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/sfx.js"></script><script src="js/app.js"></script></body></html>
